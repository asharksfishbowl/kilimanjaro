name: Climbing the Mountain

on:
  push:
    branches:
      - master
  pull_request:
    branches:
      - master

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Build
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: web
    steps:
      - name: Checkout Repo
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: web/package-lock.json

      - name: Install Dependencies
        run: npm ci

      - name: Build Production Artifact
        run: npm run build
        env:
          PUBLIC_RUST_API: ${{ vars.PUBLIC_RUST_API || '' }}
          PUBLIC_PYTHON_API: ${{ vars.PUBLIC_PYTHON_API || '' }}

      - name: Checkout Fighter RPG
        uses: actions/checkout@v4
        with:
          repository: asharksfishbowl/fighter-rpg-showdown-3d
          path: fighter-src
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Build Fighter RPG
        working-directory: fighter-src
        run: |
          npm ci
          npm run build

      - name: Nest Fighter under /fighter/
        working-directory: .
        run: |
          test -f fighter-src/dist/index.html
          mkdir -p web/dist/fighter
          cp -R fighter-src/dist/. web/dist/fighter/

      - name: Archive Production Artifact
        uses: actions/upload-artifact@v4
        with:
          name: web-dist
          path: web/dist

  deploy-pages:
    name: Deploy GitHub Pages
    needs: build
    if: github.ref == 'refs/heads/master' && github.event_name == 'push'
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Download Artifact
        uses: actions/download-artifact@v4
        with:
          name: web-dist
          path: dist

      - name: Configure Pages to use GitHub Actions
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          # Prefer Actions-based Pages so we can publish web/dist without a Firebase token.
          gh api -X PUT "repos/${{ github.repository }}/pages" \
            -H "Accept: application/vnd.github+json" \
            --input - <<'JSON' || true
          {
            "build_type": "workflow",
            "source": { "branch": "master", "path": "/" }
          }
          JSON

      - name: Setup Pages
        uses: actions/configure-pages@v5

      - name: Upload Pages Artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: dist

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4

  deploy-firebase:
    name: Deploy Firebase Hosting
    needs: build
    if: github.ref == 'refs/heads/master' && github.event_name == 'push'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repo
        uses: actions/checkout@v4

      - name: Download Artifact
        uses: actions/download-artifact@v4
        with:
          name: web-dist
          path: web/dist

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Install Firebase CLI
        run: npm install -g firebase-tools@13.29.1

      - name: Deploy Hosting to Firebase
        # Prefer Admin/service-account JSON (FIREBASE_ADMIN or FIREBASE_SERVICE_ACCOUNT).
        # Falls back to legacy FIREBASE_TOKEN if present.
        env:
          FIREBASE_ADMIN: ${{ secrets.FIREBASE_ADMIN }}
          FIREBASE_SERVICE_ACCOUNT: ${{ secrets.FIREBASE_SERVICE_ACCOUNT }}
          FIREBASE_TOKEN: ${{ secrets.FIREBASE_TOKEN }}
        run: |
          set -euo pipefail
          SA_JSON="${FIREBASE_ADMIN:-${FIREBASE_SERVICE_ACCOUNT:-}}"
          if [ -n "${SA_JSON}" ]; then
            # FIREBASE_TOKEN takes precedence in firebase-tools and the old
            # CI token is expired — clear it so the Admin key is used.
            unset FIREBASE_TOKEN
            echo "$SA_JSON" > "${RUNNER_TEMP}/firebase-sa.json"
            export GOOGLE_APPLICATION_CREDENTIALS="${RUNNER_TEMP}/firebase-sa.json"
            # Validate JSON shape without printing secrets
            python3 -c 'import json,os; json.load(open(os.environ["GOOGLE_APPLICATION_CREDENTIALS"])); print("service-account JSON ok")'
            echo "Deploying with Firebase Admin service account."
            firebase deploy --only hosting:kilimanjaro-4c1b5 --project kilimanjaro-4c1b5 --non-interactive
            rm -f "${RUNNER_TEMP}/firebase-sa.json"
          elif [ -n "${FIREBASE_TOKEN:-}" ]; then
            echo "Deploying with FIREBASE_TOKEN."
            firebase deploy --only hosting:kilimanjaro-4c1b5 --project kilimanjaro-4c1b5 --non-interactive
          else
            echo "::error::Add repo secret FIREBASE_ADMIN (Firebase Admin service-account JSON) to deploy asharksfishbowl.com"
            exit 1
          fi
